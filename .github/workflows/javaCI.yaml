name : Java App Deployment

on : 
  push :
    branches: [project_01]
permissions:
    id-token: write
    contents : read

jobs:
   build-dev:
    runs-on : ubuntu-latest

    steps: 
      - name : checkout
        uses : actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
           distribution: 'temurin'
           java-version: '17'
      - name : Configure AWS Credentials using OIDC
        uses : aws-actions/configure-aws-credentials@v4
        with : 
            aws-region : us-east-1
            role-to-assume : ${{ secrets.AWS_IAM_ROLE}}
      - name : Test AWS IAM Role
        run : aws sts get-caller-identity

      - name : Build App
        run : mvn clean package
        working-directory : Java-Login-App

      - name : upload to s3
        run : |
          aws s3 cp /home/runner/work/GitActions/GitActions/Java-Login-App/target/dptweb-1.0.war s3://java-app-bucket-01/
      
 
       #Step 7: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.6

      # Step 8: Terraform Init
      - name: Terraform Init
        run: terraform init

      # Step 9: Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Step 10: Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
